<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Palette Generator — Finley Tails</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="palette-page">
  <nav class="site-nav">
    <a href="index.html" class="logo">Finley Tails</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox">
    <label for="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </label>
    <div class="nav-links">
      <a href="books.html">Books</a>
      <a href="palette.html" class="current">Palette Generator</a>
    </div>
  </nav>

  <header>
    <div class="brand">
      <h1>Ohuhu Palette</h1>
      <span class="brand-sub">finleytails.com</span>
    </div>
    <div class="controls">
      <span class="hint"><kbd>Space</kbd> generate · <kbd>←</kbd><kbd>→</kbd> history · Click to copy</span>
      <div class="action-bar">
        <div class="nav-controls">
          <button id="back-btn" class="nav-btn" title="Previous palette (←)" aria-label="Previous palette">&larr;</button>
          <button id="forward-btn" class="nav-btn" title="Next palette (→)" aria-label="Next palette">&rarr;</button>
        </div>
        <label class="old-toggle" title="Show pre-rename (R2) codes and names">
          <input type="checkbox" id="old-names-checkbox">
          <span class="switch" aria-hidden="true"></span>
          <span class="old-toggle-label">Old names</span>
        </label>
        <button id="generate-btn">Generate</button>
      </div>
    </div>
  </header>

  <main id="palette"></main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="marker_palettes.js"></script>
  <script src="script.js"></script>
</body>
</html>
